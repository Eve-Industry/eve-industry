<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="18" fill="#0d1520"/>
  <!-- Outer hex frame -->
  <polygon points="50,6 91,28 91,72 50,94 9,72 9,28" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner hex body -->
  <polygon points="50,16 81,34 81,66 50,84 19,66 19,34" fill="#080c10" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Connector spokes -->
  <line x1="50" y1="6"  x2="50" y2="16" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="84" x2="50" y2="94" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="34" x2="9"  y2="28" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="81" y1="34" x2="91" y2="28" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="66" x2="9"  y2="72" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="81" y1="66" x2="91" y2="72" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- Stylised E mark -->
  <rect x="36" y="35" width="6"  height="30" fill="#00d4ff"/>
  <rect x="36" y="35" width="24" height="5"  fill="#00d4ff"/>
  <rect x="36" y="47" width="16" height="5"  fill="#00d4ff" opacity="0.85"/>
  <rect x="36" y="60" width="24" height="5"  fill="#00d4ff"/>
  <!-- Amber accent pip -->
  <rect x="46" y="6" width="8" height="9" rx="1" fill="#ff9500"/>
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="45" ry="10" fill="none" stroke="#00d4ff" stroke-width="0.75" stroke-dasharray="5 4" opacity="0.3" transform="rotate(-20 50 50)"/>
</svg>

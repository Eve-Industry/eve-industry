<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="100" fill="#080c10"/>

  <!-- ICON MARK -->
  <g transform="translate(8, 8)">
    <!-- Outer hex frame -->
    <polygon points="42,0 84,21 84,63 42,84 0,63 0,21" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    <!-- Middle hex hint -->
    <polygon points="42,8 76,26 76,58 42,76 8,58 8,26" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
    <!-- Inner hex body -->
    <polygon points="42,18 68,32 68,52 42,66 16,52 16,32" fill="#0a1a2e" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
    <!-- Spokes -->
    <line x1="42" y1="18" x2="42" y2="0"  stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="42" y1="66" x2="42" y2="84" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="16" y1="32" x2="0"  y2="21" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="32" x2="84" y2="21" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="16" y1="52" x2="0"  y2="63" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="52" x2="84" y2="63" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <!-- E letterform -->
    <rect x="30" y="30" width="5"  height="24" fill="#00d4ff" filter="url(#glow)"/>
    <rect x="30" y="30" width="20" height="4"  fill="#00d4ff" filter="url(#glow)"/>
    <rect x="30" y="40" width="14" height="4"  fill="#00d4ff" opacity="0.85" filter="url(#glow)"/>
    <rect x="30" y="50" width="20" height="4"  fill="#00d4ff" filter="url(#glow)"/>
    <!-- Amber pip -->
    <rect x="40" y="0" width="4" height="6" fill="#ff9500" opacity="0.9"/>
    <!-- Orbit ring -->
    <ellipse cx="42" cy="42" rx="38" ry="8" fill="none" stroke="#00d4ff" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.35" transform="rotate(-20 42 42)"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(106, 18)" font-family="Orbitron, 'Orbitron', sans-serif" fill="#e8f4ff">
    <text y="32" font-size="34" font-weight="900" letter-spacing="4" fill="url(#cyanGrad)" filter="url(#glow)">EVE</text>
    <text y="54" font-size="13.5" font-weight="400" letter-spacing="8" fill="#e8f4ff" opacity="0.75">INDUSTRIAL</text>
    <line x1="0" y1="60" x2="260" y2="60" stroke="#00d4ff" stroke-width="0.5" opacity="0.25"/>
    <text y="72" font-size="8.5" font-family="'Share Tech Mono', monospace" fill="#4a6a8a" letter-spacing="2">.app</text>
  </g>

  <!-- Right amber accent bar -->
  <line x1="470" y1="20" x2="470" y2="80" stroke="#ff9500" stroke-width="2" opacity="0.6"/>
  <line x1="466" y1="20" x2="466" y2="80" stroke="#ff9500" stroke-width="0.5" opacity="0.3"/>
</svg>

# Local development: the source is bind-mounted into PHP-FPM, Horizon and
# scheduler containers built from the dev Dockerfile, with one Redis.
#   docker compose -f docker-compose.dev.yml up -d
# Run `composer install` and `php artisan migrate` in the app container.
# docker-compose.yml is the deployable role split (one image, separate
# web / worker / scheduler, a migrate step and two Redis roles).
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve-auth-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - eve-auth
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: eve-auth-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eve-auth
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: eve-auth-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: eve_auth
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: eve_auth
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - eve-auth

  redis:
    image: redis:alpine
    container_name: eve-auth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - eve-auth

  # Horizon runs the queue supervisors defined in config/horizon.php.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve-auth-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./:/var/www
    networks:
      - eve-auth
    depends_on:
      - app
      - mysql
      - redis

  # Runs every task in routes/console.php on schedule.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve-auth-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - eve-auth
    depends_on:
      - app
      - mysql
      - redis

networks:
  eve-auth:
    driver: bridge

volumes:
  mysql-data:

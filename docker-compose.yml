# Build-from-source stack: one image (Dockerfile.app) in separate roles.
# To just run a released version use deploy/docker-compose.yml (see docs/self-hosting/).
#
#   migrate    one-off: `php artisan migrate --force`, then exits. web,
#              worker and scheduler wait for it to finish successfully, so
#              each `docker compose up` migrates exactly once and no
#              long-running container ever migrates.
#   web        nginx + PHP-FPM on :8080
#   worker     Horizon (default, market and updates queues; <= 5 processes)
#   scheduler  schedule:work (exactly one)
#   redis      queues, Horizon and locks: noeviction, AOF on
#   redis-cache cache and sessions: allkeys-lru, no persistence
#
# Deploy:  docker compose build && docker compose up -d
#          docker/smoke-test.sh http://localhost:8080
# Local development with live code: docker-compose.dev.yml.
#
# Secrets come from .env (APP_KEY, EVE_*, DB_PASSWORD...). The values under
# `environment` below override .env so the containers find each other.

x-app: &app
  image: eve-industrialist:latest
  build:
    context: .
    dockerfile: Dockerfile.app
  env_file: .env
  environment: &app-env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CACHE_HOST: redis-cache
    REDIS_CACHE_PORT: "6379"
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: sessions
    QUEUE_CONNECTION: redis
  networks:
    - eve-industrialist
  depends_on: &app-depends
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  migrate:
    <<: *app
    container_name: eve-industrialist-migrate
    environment:
      <<: *app-env
      APP_ROLE: migrate
    restart: "no"

  web:
    <<: *app
    container_name: eve-industrialist-web
    environment:
      <<: *app-env
      APP_ROLE: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    container_name: eve-industrialist-worker
    environment:
      <<: *app-env
      APP_ROLE: worker
    restart: unless-stopped
    stop_grace_period: 330s  # let Horizon finish a job (longest market timeout 300 s)
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    container_name: eve-industrialist-scheduler
    environment:
      <<: *app-env
      APP_ROLE: scheduler
    restart: unless-stopped
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.0
    container_name: eve-industrialist-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eve_auth}
      MYSQL_USER: ${DB_USERNAME:-eve_auth}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Queues, Horizon state and cache locks. Losing a key here loses a job or
  # a lock, so it never evicts and keeps an append-only file.
  redis:
    image: redis:7-alpine
    container_name: eve-industrialist-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cache and sessions: bounded, least-recently-used keys evicted first,
  # nothing persisted (everything here can be rebuilt).
  redis-cache:
    image: redis:7-alpine
    container_name: eve-industrialist-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  eve-industrialist:
    driver: bridge

volumes:
  mysql-data:
  redis-queue-data:

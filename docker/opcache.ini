; OPcache configuration for production
; Caches precompiled PHP bytecode in shared memory to avoid recompiling
; scripts on every request, dramatically reducing CPU usage.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Disable timestamp validation in production so PHP never stats files on
; each request. Rebuild the image (or flush opcache) to deploy code changes.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Realpath cache tuning to reduce filesystem stat() calls.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

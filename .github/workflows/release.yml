name: Release

# Tag vX.Y.Z to publish ghcr.io/eve-industry/eve-industry:{X.Y.Z,X.Y,latest}
# (amd64 + arm64), scan and sign it, and attach the installer files.

on:
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eve-industry/eve-industry
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/eve-industry/eve-industry@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes ghcr.io/eve-industry/eve-industry@${{ steps.build.outputs.digest }}

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deploy/install.sh
            deploy/install.ps1
            deploy/docker-compose.yml
            deploy/docker-compose.no-proxy.yml
            deploy/Caddyfile
            deploy/.env.example

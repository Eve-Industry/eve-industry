name: CI

on:
  pull_request:
  push:
    branches: [master, main, v2]

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The typed client is generated from the committed OpenAPI spec; fail if
      # schema.d.ts was not regenerated after the API changed.
      - name: Check API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - run: npm run build
      - run: npm test

      # 120 kB gzip for the shell, 60 kB per route chunk (see package.json).
      - run: npm run size

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      # The committed spec is the /api/v1 contract. Regenerate it and fail if
      # it drifted. Resources cast every field, so the output does not depend
      # on the database; in-memory SQLite just avoids needing MySQL here.
      - name: Check OpenAPI spec is up to date
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan scramble:export --path="$RUNNER_TEMP/openapi.json"
          if ! diff -u docs/openapi.json "$RUNNER_TEMP/openapi.json"; then
            echo "::error file=docs/openapi.json::OpenAPI spec is out of date. Run 'php artisan scramble:export' (with DB_CONNECTION=sqlite DB_DATABASE=:memory:) and commit docs/openapi.json."
            exit 1
          fi

      # Account impersonation was removed on purpose; keep it out.
      - name: No impersonation code
        run: |
          if grep -rIil "impersonat" app routes config database resources frontend/src docs \
              --exclude=AdminUsersTest.php; then
            echo "::error::Impersonation must not be reintroduced."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organisations; the CLI image is free.
      - name: Scan history and tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose

  docker:
    # Builds the production image and boots the self-hosting stack from deploy/
    # to make sure a fresh install still comes up healthy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.app
          failure-threshold: error

      - name: Build image
        run: docker build -f Dockerfile.app -t eve-industrialist:ci .

      - name: Boot the stack
        working-directory: deploy
        run: |
          cp .env.example .env
          {
            echo "EVE_IMAGE=eve-industrialist"
            echo "EVE_VERSION=ci"
            echo "APP_URL=http://localhost"
            echo "SITE_ADDRESS=http://localhost"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "EVE_CLIENT_ID=ci"
            echo "EVE_CLIENT_SECRET=ci"
            echo "ESI_USER_AGENT=ci (ci@example.com)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.no-proxy.yml"
            echo "WEB_PORT=8080"
          } >> .env
          docker compose up -d migrate mysql redis redis-cache web worker scheduler
          for _ in $(seq 1 60); do
            [ "$(docker compose ps web --format '{{.Health}}')" = healthy ] && break
            sleep 5
          done
          docker compose ps
          docker compose ps web --format '{{.Health}}' | grep -q healthy

      - name: Smoke test
        run: docker/smoke-test.sh http://127.0.0.1:8080

      - name: Worker is healthy and logs
        # Only once the stack was configured; otherwise this masks an earlier build failure.
        if: always() && hashFiles('deploy/.env') != ''
        working-directory: deploy
        run: |
          docker compose ps worker scheduler
          docker compose logs --tail 50 web worker migrate

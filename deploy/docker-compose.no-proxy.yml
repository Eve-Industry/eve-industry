# Override for people who bring their own reverse proxy: turns the bundled
# Caddy off and publishes web on localhost only. Enable with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.no-proxy.yml
# in .env. Point your proxy at http://127.0.0.1:${WEB_PORT:-8080} and forward
# X-Forwarded-For / X-Forwarded-Proto. If your proxy is not on a private
# network, set TRUSTED_PROXIES to its address.
services:
  caddy:
    profiles: ["disabled"]

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

# Use a managed MySQL server instead of the bundled one. Enable with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.managed-db.yml
# in .env, and set DB_HOST, DB_PORT and MYSQL_ATTR_SSL_CA there.
x-managed-db: &managed-db
  environment:
    DB_HOST: ${DB_HOST:?DB_HOST is required}
    DB_PORT: ${DB_PORT:-3306}
    MYSQL_ATTR_SSL_CA: ${MYSQL_ATTR_SSL_CA:-/etc/ssl/certs/db-ca.crt}
  volumes:
    - ./db-ca.crt:/etc/ssl/certs/db-ca.crt:ro
  depends_on: !override
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    profiles: ["disabled"]

  migrate:
    <<: *managed-db
    depends_on: !override
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
  install:
    <<: *managed-db
  web:
    <<: *managed-db
  worker:
    <<: *managed-db
  scheduler:
    <<: *managed-db

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eve.secretName" . }}
  labels:
    {{- include "eve.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "secrets.appKey is required (or set existingSecret)" .Values.secrets.appKey | quote }}
  EVE_CLIENT_ID: {{ required "secrets.eveClientId is required (or set existingSecret)" .Values.secrets.eveClientId | quote }}
  EVE_CLIENT_SECRET: {{ required "secrets.eveClientSecret is required (or set existingSecret)" .Values.secrets.eveClientSecret | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required (or set existingSecret)" .Values.secrets.dbPassword | quote }}
  {{- if .Values.mysql.enabled }}
  DB_ROOT_PASSWORD: {{ required "secrets.dbRootPassword is required for the bundled MySQL (or set existingSecret)" .Values.secrets.dbRootPassword | quote }}
  {{- end }}
  {{- with .Values.secrets.superAdminPassword }}
  SUPER_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- $fullname := include "eve.fullname" . -}}
{{- $dataSecurity := dict "runAsUser" 999 "runAsGroup" 999 "fsGroup" 999 "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $containerSecurity := dict "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) -}}
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mysql
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  selector:
    {{- include "eve.selectorLabels" (list . "mysql") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-mysql
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ $fullname }}-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "eve.selectorLabels" (list . "mysql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "mysql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $dataSecurity | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "eve.secretName" . }}, key: DB_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "eve.secretName" . }}, key: DB_ROOT_PASSWORD }
          ports:
            - name: mysql
              containerPort: 3306
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
          startupProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"] }
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.mysql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mysql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
{{- end }}
{{- if .Values.redis.enabled }}
---
# Queues, Horizon state, locks and sessions. Losing a key here loses a job or
# a lock, so it never evicts and keeps an append-only file.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "eve.selectorLabels" (list . "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ $fullname }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "eve.selectorLabels" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $dataSecurity | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) $containerSecurity) | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
          {{- with .Values.redis.queue.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.queue.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.queue.persistence.size }}
---
# Cache: bounded, least-recently-used keys evicted first, nothing persisted
# (everything here can be rebuilt).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis-cache
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-cache
spec:
  selector:
    {{- include "eve.selectorLabels" (list . "redis-cache") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis-cache
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eve.selectorLabels" (list . "redis-cache") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "redis-cache") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $dataSecurity | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--maxmemory", {{ .Values.redis.cache.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) $containerSecurity) | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
          {{- with .Values.redis.cache.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}

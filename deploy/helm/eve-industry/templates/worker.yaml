{{- $fullname := include "eve.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # Never two Horizon masters at once: that would double the worker processes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "eve.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "worker") | nindent 8 }}
      annotations:
        {{- include "eve.checksums" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "eve.podSpec" . | nindent 6 }}
      # On the stop signal Horizon stops taking jobs and waits for running ones (docker/start.sh).
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      initContainers:
        {{- include "eve.awaitMigrations" . | nindent 8 }}
      containers:
        {{- include "eve.container" (dict "root" . "role" "worker" "resources" .Values.worker.resources) | nindent 8 }}
      volumes:
        {{- include "eve.volumes" (dict "root" .) | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-scheduler
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # Exactly one: every scheduled task also takes an onOneServer() lock.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "eve.selectorLabels" (list . "scheduler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "scheduler") | nindent 8 }}
      annotations:
        {{- include "eve.checksums" . | nindent 8 }}
        {{- with .Values.scheduler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "eve.podSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        {{- include "eve.awaitMigrations" . | nindent 8 }}
      containers:
        {{- include "eve.container" (dict "root" . "role" "scheduler" "resources" .Values.scheduler.resources) | nindent 8 }}
      volumes:
        {{- include "eve.volumes" (dict "root" .) | nindent 8 }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

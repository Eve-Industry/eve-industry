{{- $url := required "app.url is required (the public URL, no trailing slash)" .Values.app.url | trimSuffix "/" -}}
{{- $fullname := include "eve.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "eve.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: {{ $url | quote }}
  EVE_REDIRECT_URI: {{ .Values.app.eveRedirectUri | default (printf "%s/auth/eve/callback" $url) | quote }}
  ESI_USER_AGENT: {{ required "app.esiUserAgent is required (app name and contact, as CCP asks)" .Values.app.esiUserAgent | quote }}
  TRUSTED_PROXIES: {{ .Values.app.trustedProxies | quote }}
  {{- with .Values.app.theme }}
  APP_THEME: {{ . | quote }}
  {{- end }}
  SUPER_ADMIN_NAME: {{ .Values.app.superAdmin.name | quote }}
  SUPER_ADMIN_EMAIL: {{ .Values.app.superAdmin.email | quote }}
  # Logs go to the container output (kubectl logs), not files in storage/.
  LOG_CHANNEL: stderr
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DB_CONNECTION: mysql
  DB_HOST: {{ include "eve.dbHost" . | quote }}
  {{- if .Values.mysql.enabled }}
  DB_PORT: "3306"
  DB_DATABASE: {{ .Values.mysql.database | quote }}
  DB_USERNAME: {{ .Values.mysql.username | quote }}
  {{- else }}
  DB_PORT: {{ .Values.externalDatabase.port | quote }}
  DB_DATABASE: {{ .Values.externalDatabase.database | quote }}
  DB_USERNAME: {{ .Values.externalDatabase.username | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ printf "%s-redis" $fullname | quote }}
  REDIS_PORT: "6379"
  REDIS_CACHE_HOST: {{ printf "%s-redis-cache" $fullname | quote }}
  REDIS_CACHE_PORT: "6379"
  {{- else }}
  REDIS_HOST: {{ required "externalRedis.host is required when redis.enabled is false" .Values.externalRedis.host | quote }}
  REDIS_PORT: {{ .Values.externalRedis.port | quote }}
  {{- with .Values.externalRedis.cacheHost }}
  REDIS_CACHE_HOST: {{ . | quote }}
  REDIS_CACHE_PORT: {{ $.Values.externalRedis.cachePort | quote }}
  {{- end }}
  {{- end }}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: sessions
  QUEUE_CONNECTION: redis
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

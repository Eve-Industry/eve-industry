{{- $fullname := include "eve.fullname" . -}}
{{- /*
One migrate Job per revision and image: a new name each upgrade, because a Job's
pod template cannot be changed in place. Helm deletes the previous revision's
Job. App pods wait for it in their await-migrations init container, so this
works with `helm --wait` and with GitOps tools that ignore Helm hooks.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%s" $fullname (printf "%d-%s" .Release.Revision (include "eve.image" .) | sha256sum | trunc 8) }}
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "migrate") | nindent 8 }}
    spec:
      {{- include "eve.podSpec" . | nindent 6 }}
      # Retries until the database accepts connections (the bundled MySQL starts alongside).
      restartPolicy: OnFailure
      containers:
        {{- include "eve.container" (dict "root" . "role" "migrate" "resources" .Values.migrate.resources) | nindent 8 }}
      volumes:
        {{- include "eve.volumes" (dict "root" .) | nindent 8 }}
{{- if and .Values.install.enabled .Release.IsInstall }}
---
# First-run setup, rendered on `helm install` only and kept afterwards (Helm
# would otherwise delete it on the next upgrade, possibly mid-import).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-install
  labels:
    {{- include "eve.labels" . | nindent 4 }}
    app.kubernetes.io/component: install
  annotations:
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.install.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "eve.selectorLabels" (list . "install") | nindent 8 }}
    spec:
      {{- include "eve.podSpec" . | nindent 6 }}
      restartPolicy: Never
      initContainers:
        {{- include "eve.awaitMigrations" . | nindent 8 }}
      containers:
        {{- include "eve.container" (dict "root" . "role" "install" "resources" .Values.install.resources "extraEnv" (list (dict "name" "INSTALL_ARGS" "value" "--no-migrate"))) | nindent 8 }}
      volumes:
        {{- include "eve.volumes" (dict "root" .) | nindent 8 }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eve.serviceAccountName" . }}
  labels:
    {{- include "eve.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eve.fullname" . }}-uploads
  labels:
    {{- include "eve.labels" . | nindent 4 }}
  annotations:
    # Uploaded files survive `helm uninstall`; delete the claim yourself.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if .Values.customThemes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eve.fullname" . }}-themes
  labels:
    {{- include "eve.labels" . | nindent 4 }}
data:
  {{- range $name, $css := .Values.customThemes }}
  {{ $name }}.css: |
    {{- $css | nindent 4 }}
  {{- end }}
{{- end }}

# External database and Redis, own Secret, several web pods on shared storage.
app:
  url: https://eve.example.com
  esiUserAgent: ci (ci@example.com)
  theme: corp
existingSecret: eve-industry-secrets
mysql:
  enabled: false
externalDatabase:
  host: mysql.example.internal
redis:
  enabled: false
externalRedis:
  host: redis.example.internal
  cacheHost: redis-cache.example.internal
persistence:
  accessMode: ReadWriteMany
web:
  replicas: 3
  autoscaling:
    enabled: true
ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
customThemes:
  corp: |
    :root { --accent: #ff8800; }

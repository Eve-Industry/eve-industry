# Eve Industrialist on DigitalOcean App Platform. Guide: docs/self-hosting/digitalocean-app-platform.md
#
# Before `doctl apps create --spec deploy/digitalocean-app.yaml`:
#   * create the three database clusters named below (MySQL, two Valkey) in the same region,
#     and a Spaces bucket with an access key
#   * replace every CHANGE_ME, and the domain
# Do not commit a filled-in copy: it holds secrets.
#
# Provided as is, without warranty. See LICENSE (AGPL-3.0).
name: eve-industry
region: ams

domains:
  - domain: eve.example.com
    type: PRIMARY

# Shared by every component (web, worker, scheduler and both jobs).
envs:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: "false"
  - key: APP_NAME
    value: Eve Industrialist
  - key: APP_URL
    value: https://eve.example.com
  - key: APP_KEY
    type: SECRET
    value: CHANGE_ME # echo "base64:$(openssl rand -base64 32)", and keep a copy
  # App Platform's router is the only way in, and its addresses are not published.
  - key: TRUSTED_PROXIES
    value: "*"
  # The filesystem is thrown away on every deploy: log to the console.
  - key: LOG_CHANNEL
    value: stderr
  - key: LOG_LEVEL
    value: warning

  - key: EVE_CLIENT_ID
    value: CHANGE_ME
  - key: EVE_CLIENT_SECRET
    type: SECRET
    value: CHANGE_ME
  - key: EVE_REDIRECT_URI
    value: https://eve.example.com/auth/eve/callback
  - key: ESI_USER_AGENT
    value: EveIndustrialist/2.0 (you@example.com; +https://eve.example.com)
  - key: ESI_ENCRYPT_TOKENS
    value: "true"

  - key: SUPER_ADMIN_NAME
    value: Super Admin
  - key: SUPER_ADMIN_EMAIL
    value: admin@example.com

  # Managed MySQL (component "db" below). DB_CA_CERT is written to a file at start-up.
  - key: DB_CONNECTION
    value: mysql
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_DATABASE
    value: ${db.DATABASE}
  - key: DB_USERNAME
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: DB_CA_CERT
    value: ${db.CA_CERT}

  # Queues, Horizon, locks and sessions: Valkey with eviction policy noeviction.
  - key: REDIS_SCHEME
    value: tls
  - key: REDIS_HOST
    value: ${queue.HOSTNAME}
  - key: REDIS_PORT
    value: ${queue.PORT}
  - key: REDIS_USERNAME
    value: ${queue.USERNAME}
  - key: REDIS_PASSWORD
    value: ${queue.PASSWORD}
  # Cache: Valkey with eviction policy allkeys-lru.
  - key: REDIS_CACHE_HOST
    value: ${cache.HOSTNAME}
  - key: REDIS_CACHE_PORT
    value: ${cache.PORT}
  - key: REDIS_CACHE_USERNAME
    value: ${cache.USERNAME}
  - key: REDIS_CACHE_PASSWORD
    value: ${cache.PASSWORD}
  - key: REDIS_CACHE_DB
    value: "0"
  # Sponsor banners in a Spaces bucket: the container disk is not kept.
  - key: UPLOADS_DISK
    value: s3
  - key: AWS_ACCESS_KEY_ID
    value: CHANGE_ME
  - key: AWS_SECRET_ACCESS_KEY
    type: SECRET
    value: CHANGE_ME
  - key: AWS_DEFAULT_REGION
    value: us-east-1 # Spaces ignores it, the SDK needs one
  - key: AWS_BUCKET
    value: CHANGE_ME
  - key: AWS_ENDPOINT
    value: https://ams3.digitaloceanspaces.com
  - key: AWS_URL
    value: https://CHANGE_ME.ams3.digitaloceanspaces.com # or the bucket's CDN endpoint

  - key: CACHE_STORE
    value: redis
  - key: SESSION_DRIVER
    value: redis
  - key: SESSION_CONNECTION
    value: sessions
  - key: QUEUE_CONNECTION
    value: redis

databases:
  - name: db
    engine: MYSQL
    production: true
    cluster_name: eve-mysql
    db_name: eve_industrialist
    db_user: eve_industrialist
  - name: queue
    engine: VALKEY
    production: true
    cluster_name: eve-valkey-queue
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: eve-valkey-cache

services:
  - name: web
    image:
      registry_type: GHCR
      registry: eve-industry
      repository: eve-industry
      tag: "1.0.3"
    envs:
      - key: APP_ROLE
        value: web
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    # Can be raised: sessions are in Valkey and uploads in Spaces.
    instance_count: 1
    health_check:
      http_path: /up
      initial_delay_seconds: 20

workers:
  - name: worker
    image:
      registry_type: GHCR
      registry: eve-industry
      repository: eve-industry
      tag: "1.0.3"
    envs:
      - key: APP_ROLE
        value: worker
    # Horizon runs up to 5 processes; never more than one instance (ESI rate limits).
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    termination:
      grace_period_seconds: 330 # let Horizon finish a job (longest market timeout 300 s)

  - name: scheduler
    image:
      registry_type: GHCR
      registry: eve-industry
      repository: eve-industry
      tag: "1.0.3"
    envs:
      - key: APP_ROLE
        value: scheduler
    # Exactly one. Runs the SDE import and price update inline, so it needs the memory.
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: eve-industry
      repository: eve-industry
      tag: "1.0.3"
    envs:
      - key: APP_ROLE
        value: migrate
    instance_size_slug: apps-s-1vcpu-1gb

  # Admin account and first game-data import. Skips what is already done, so it is
  # cheap on later deploys. The generated admin password is in its first log, once.
  - name: install
    kind: POST_DEPLOY
    image:
      registry_type: GHCR
      registry: eve-industry
      repository: eve-industry
      tag: "1.0.3"
    envs:
      - key: APP_ROLE
        value: install
      - key: INSTALL_ARGS
        value: --no-migrate
    instance_size_slug: apps-s-1vcpu-2gb

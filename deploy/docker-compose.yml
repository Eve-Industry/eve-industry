# Eve Industrialist: self-hosted stack.
#
#   caddy        public entrypoint, automatic HTTPS (Let's Encrypt)
#   web          nginx + PHP-FPM (not published; only Caddy reaches it)
#   worker       Horizon queue workers
#   scheduler    the Laravel scheduler (exactly one)
#   migrate      one-off: database migrations, then exits
#   install      one-off: first-run setup (admin account, game data), then exits
#   mysql        database
#   redis        queues and locks (never evicts, append-only file)
#   redis-cache  cache and sessions (bounded, LRU)
#
# Use install.sh (or install.ps1) to create .env and start everything, or copy
# .env.example to .env, fill it in and run:  docker compose up -d
#
# No proxy (you already run nginx/Traefik/Cloudflare Tunnel)? Set
#   COMPOSE_FILE=docker-compose.yml:docker-compose.no-proxy.yml
# in .env: web is then published on 127.0.0.1:${WEB_PORT:-8080}.
#
# Provided as is, without warranty. See LICENSE (AGPL-3.0).

# A fixed project name, so this stack never shares containers or volumes with another
# Compose project that happens to live in a folder with the same name. To run a second
# copy on the same machine, set COMPOSE_PROJECT_NAME in its .env.
name: eve-industry

x-app: &app
  image: ${EVE_IMAGE:-ghcr.io/eve-industry/eve-industry}:${EVE_VERSION:-latest}
  env_file: .env
  environment: &app-env
    APP_KEY: ${APP_KEY:?APP_KEY is required (see .env.example)}
    APP_URL: ${APP_URL:?APP_URL is required}
    EVE_CLIENT_ID: ${EVE_CLIENT_ID:?EVE_CLIENT_ID is required}
    EVE_CLIENT_SECRET: ${EVE_CLIENT_SECRET:?EVE_CLIENT_SECRET is required}
    ESI_USER_AGENT: ${ESI_USER_AGENT:?ESI_USER_AGENT is required (name and contact, as CCP asks)}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-eve_industrialist}
    DB_USERNAME: ${DB_USERNAME:-eve_industrialist}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CACHE_HOST: redis-cache
    REDIS_CACHE_PORT: "6379"
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: sessions
    QUEUE_CONNECTION: redis
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: daily
  volumes:
    - storage-data:/var/www/html/storage
    # Your own themes: ./themes/<name>/theme.css, then APP_THEME=<name> (docs/styling.md)
    - ./themes:/var/www/html/public/themes-custom:ro
  networks:
    - eve-industrialist
  depends_on: &app-depends
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # HTTP_PORT must match the port in SITE_ADDRESS (only for http://localhost:PORT;
      # automatic HTTPS for a public domain needs 80 and 443).
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (your domain, or http://localhost)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - eve-industrialist
    depends_on:
      web:
        condition: service_healthy

  migrate:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: migrate
    restart: "no"

  install:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: install
      INSTALL_ARGS: --no-migrate
    restart: "no"
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: web
    restart: unless-stopped
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    restart: unless-stopped
    # The image's SIGQUIT (for nginx) is ignored by Horizon, which only handles SIGTERM.
    stop_signal: SIGTERM
    stop_grace_period: 330s  # let Horizon finish a job (longest market timeout 300 s)
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: scheduler
    restart: unless-stopped
    # schedule:work has no signal handler, and PID 1 ignores unhandled signals, so run
    # it under an init that delivers SIGTERM and lets it exit at once.
    init: true
    stop_signal: SIGTERM
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eve_industrialist}
      MYSQL_USER: ${DB_USERNAME:-eve_industrialist}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Queues, Horizon state and cache locks: never evicts, keeps an append-only file.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cache and sessions: bounded, least-recently-used keys evicted, nothing persisted.
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks:
      - eve-industrialist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  eve-industrialist:
    driver: bridge

volumes:
  mysql-data:
  redis-queue-data:
  storage-data:
  caddy-data:
  caddy-config:
